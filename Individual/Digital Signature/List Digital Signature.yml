info:
  name: List Digital Signature
  type: http
  seq: 3

http:
  method: GET
  url: "{{individual_host}}/other-services/digital-signature?pageSize=100&numPage=0"
  headers:
    - name: platform
      value: WEB
    - name: Authorization
      value: Bearer {{individual_token}}
  params:
    - name: pageSize
      value: "100"
      type: query
    - name: numPage
      value: "0"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
