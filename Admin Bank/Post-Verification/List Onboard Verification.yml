info:
  name: List Onboard Verification
  type: http
  seq: 2

http:
  method: GET
  url: "{{individual_admin_host}}/individual-onboard-verification/search?pageNum=0&pageSize=10"
  headers:
    - name: platform
      value: WEB
    - name: Authorization
      value: Bearer {{individual_admin_token}}
  params:
    - name: pageNum
      value: "0"
      type: query
    - name: pageSize
      value: "10"
      type: query

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
