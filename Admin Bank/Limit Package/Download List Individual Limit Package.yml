info:
  name: Download List Individual Limit Package
  type: http
  seq: 3

http:
  method: GET
  url: "{{individual_admin_host}}/limit-package-request/limit-package/download?pageSize=9999&numPage=0&status=ACTIVE"
  headers:
    - name: platform
      value: WEB
    - name: Authorization
      value: Bearer {{individual_admin_token}}
    - name: Language
      value: en
  params:
    - name: pageSize
      value: "9999"
      type: query
    - name: numPage
      value: "0"
      type: query
    - name: status
      value: ACTIVE
      type: query
  body:
    type: json
    data: ""

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
