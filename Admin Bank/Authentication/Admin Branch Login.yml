info:
  name: Admin Branch Login
  type: http
  seq: 1

http:
  method: post
  url: "{{individual_admin_host}}/auth/branch-login"
  headers:
    - name: platform
      value: WEB
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "branchId": 5, // 2 - HEAD OFFICE    5 - BUSINESS CENTER
        "tempToken": "{{individual_admin_token}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const json = res.getBody();

        try {
            // Get access token from response
            const token = json?.data?.token;

            // Skip if token is missing, null, or empty
            if (!token) {
                console.log("data.token field is missing or empty");
            } else {
                // Save token to environment variable
                bru.setEnvVar("individual_admin_token", token);

                console.log("individual_admin_token saved successfully");
            }
        } catch (err) {
            // Ignore parsing or runtime errors
            console.log("Skip saving token:", err.message);
        }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
