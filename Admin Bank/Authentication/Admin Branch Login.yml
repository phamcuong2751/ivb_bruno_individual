info:
  name: Admin Branch Login
  type: http
  seq: 1

http:
  method: post
  url: "{{individual_admin_host}}/auth/branch-login"
  headers:
    - name: platform
      value: WEB
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "branchId": 2, // 2 5
        "tempToken": "{{individual_admin_token}}"
      }
  auth: inherit

runtime:
  variables:
    - name: individual_admin_host
      value: http://localhost:9092
  scripts:
    - type: after-response
      code: |-
        try {
            const body = res.getBody();
            const response = typeof body === "string"
                ? JSON.parse(body)
                : body;

            if (response?.data?.token) {
                bru.setEnvVar(
                    "individual_admin_branch_token",
                    response.data.token
                );
                console.log("individual_admin_branch_token updated");
            }
        } catch (e) {
            console.log("Skip update individual_admin_branch_token:", e.message);
        }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
