info:
  name: Create Individual Monitoring Level
  type: http
  seq: 1

http:
  method: post
  url: "{{individual_admin_host}}/monitoring-level"
  headers:
    - name: platform
      value: WEB
    - name: Authorization
      value: Bearer {{individual_admin_token}}
  body:
    type: json
    data: |-
      {
        "name": "Rule chặn 200 triệu",
        "code": "IVB_LEVEL_200",
        "type": "MONITORING_TRANSACTION",
        "feature": "NAPAS247",
        "minimumTransactionCcy": "VND",
        "minimumTransactionAmount": 88888888,
        "startTime": "05:11",
        "endTime": "23:59",
        "customerSegment": "INDIVIDUAL",
        "alertMethod": "EMAIL",
        "alertRecipientType": "ALL",
        "internalRecipientIds": [
          "cfdef0bc-db39-4fdc-877b-2f74109fb3b9"
        ]
      }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
