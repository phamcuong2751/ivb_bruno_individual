      value: "5"
      type: query
    - name: numPage
      value: "0"
      type: query
    - name: keyword
      value: "200"
      type: query
      disabled: true
    - name: type
      value: MONITORING_TRANSACTION
      type: query
      disabled: true
    - name: feature
      value: INTERNAL
      type: query
      disabled: true
    - name: feature
      value: NAPAS247
      type: query
      disabled: true
    - name: status
      value: ACTIVE
      type: query
      disabled: true
    - name: status
      value: INACTIVE
      type: query
      disabled: true
    - name: minimumTransactionCcy
      value: USD
      type: query
      disabled: true

settings:
