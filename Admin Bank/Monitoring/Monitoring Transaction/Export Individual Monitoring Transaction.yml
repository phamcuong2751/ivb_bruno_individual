info:
  name: Export Individual Monitoring Transaction
  type: http
  seq: 3

http:
  method: GET
  url: "{{individual_admin_host}}/individual-monitoring-transaction/export?pageSize=10&numPage=0&type=EXCEL"
  headers:
    - name: platform
      value: WEB
    - name: Authorization
      value: Bearer {{individual_admin_token}}
  params:
    - name: pageSize
      value: "10"
      type: query
    - name: numPage
      value: "0"
      type: query
    - name: type
      value: PDF
      type: query
      disabled: true
    - name: type
      value: EXCEL
      type: query
  body:
    type: json
    data: ""

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
